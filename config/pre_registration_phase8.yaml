# config/pre_registration_phase8.yaml (FROZEN — CEO Ruling 2026-09-20)
phase8:
  regime_hmm:
    n_states: 3                    # CEO Ruling #12: 3-state (EXP, SHOCK, CRISIS)
    distribution: "student_t"
    nu: 6
    sticky_prior_alpha: 50
    min_dwell_months: 3
    factor_count: 15
    pca_variance_explained: 0.85
  
  regime_thresholds:
    EXPANSION:
      entry_discount: 0.15         # 0.85×IV
      target_multiple: 1.20        # CEO Ruling #7: let winners run
      max_equity: 1.0
    SHOCK:
      entry_discount: 0.05         # 0.95×IV
      target_multiple: 1.10        # CEO Ruling #7
      max_equity: 0.6
    CRISIS:
      entry_discount: 0.25         # 0.75×IV
      target_multiple: 1.05        # CEO Ruling #7: tighten in liquidity shocks
      max_equity: 0.4
      moat_requirement: true
    RECOVERY:
      entry_discount: 0.20         # 0.80×IV (SHOCK→EXP transition)
      target_multiple: 1.15
      max_equity: 0.8
      ramp_monthly: 0.05
  
  volatility_adjustment:
    high_vol_pctl: 0.90
    high_vol_additional_discount: 0.05
    low_vol_pctl: 0.10
    low_vol_reduce_discount: 0.03
    min_discount: 0.05
    max_discount: 0.30
    sentiment_vol_override_pctl: 0.95
    sentiment_override_min_discount: 0.10
  
  cooldown:
    min_hold_days: 63
    regime_switch_cooldown_days: 21
    max_switches_per_year: 6
    probation_ramp_quarters: 4
  
  quality_composite:
    quant_weight: 0.6
    qual_weight: 0.4
    premium_threshold_z: 2.0
    premium_entry_allowance: 0.05  # 0.90×IV instead of 0.85
    moat_omr_threshold: 0.5
  
  peak_tracking:
    lookback_years: 5
    alert_pctl: 0.90
    trim_alert_pctl: 0.95
  
  wacc_engine:
    erp_damodaran: 0.0450          # CEO Ruling #8: 4.50% live baseline
    vix_proxy_weight: 0.30         # ERP_option = VIX/√12 − R_f (Defect 1 fix)
    damodaran_weight: 0.70
    erp_bounds: [0.0050, 0.0800]   # 0.50% - 8.00%
    distressed_spread: 0.0885      # CEO Ruling #11: Caa/CCC table match
    spread_bounds: [0.0063, 0.1900] # CEO Ruling #10: full 14-tier coverage (D=19%)
    rho_floor: 0.25                # CEO Ruling #9: unified floor
    tax_fallback: 0.21
    tax_shield_if_ebit_negative: 1.0
    omega_stress:
      enabled: true
      max_multiplier: 3.0
      cash_burn_weight: 1.0
      icr_weight: 1.0
      sector_stress_factors: {"High": 1.5, "Medium": 1.0, "Low": 0.5}
  
  narrative_valuation:
    horizon_years: 10
    transition_years: 7
    survival_base_young: 0.60
    survival_per_year: 0.05
    survival_distressed: 0.40      # Priority 1
    survival_moat: 0.95            # Priority 3
    survival_mature: 0.90          # Priority 4
    survival_clamp: [0.05, 0.95]
    liquidation_tangible_factor: 0.70
    liquidation_cash_basis: "equity"  # No double-count
    terminal_growth_guard_bps: 50   # WACC − g > 50bps
  
  total_beta:
    correlation_floor: 0.25
    max_total_beta: 5.0            # CEO Ruling Defect 3: expanded ceiling
    sigmoid_transition_point: 3.0
    apply_to: ["small_cap", "private", "concentrated"]
    small_cap_threshold_usd: 2e9
    adv_threshold_usd: 5e6
    position_threshold_pct: 0.03
  
  sc_constraint:
    unfunded_threshold: 1.2
    growth_haircut: 0.50
    wacc_penalty_bps: 200
    credit_capacity_formula: "sector_target_debt_ratio * Total_Assets - Total_Debt"
  
  data_gate:
    min_quarters_full: 12          # 3 years
    min_quarters_probation: 8      # 2 years
    max_weight_quarantine: 0.005
    max_weight_probation: 0.010
    graduation_quarters_roic_wacc: 3
  
  mad_filter:
    window_days: 90
    mad_multiplier: 3.0
    min_observations: 30
    min_consecutive_cycles: 2
    target_trigger_rate: [0.05, 0.15]
  
  trade_audit:
    chain_verification: true
    partition_by: "month"
    retention_years: 10
    timestamp_precision: "nanosecond"
    uuid_version: 7
  
  backtest:
    walkforward_embargo_months: 12   # CEO Ruling #1
    walkforward_purge_months: 6
    walkforward_folds: 4
    holm_bonferroni_n: 16            # CEO Ruling #6
    holm_bonferroni_alpha: 0.003125
    probation_pass_band: [0.40, 0.60] # CEO Ruling #2
    ari_fail_rule: ">=2_folds"       # CEO Ruling #3
    wacc_coverage: "100%_tradable"   # CEO Ruling #4