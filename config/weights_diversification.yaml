# Pre-registered Phase-3 configuration (D-20260803-005, MODIFY ruling).
#
# CEO MODIFY: three test strategies (STATIC-40/20/20/20, STATIC-after-ML,
# ADAPTIVE) + opportunistic-only baseline, with a risk-constrained ML weight
# optimizer. EVERY value here is fixed BEFORE any run; nothing is fit to
# reported outcomes (auditor no-hardcoding/OOS requirement). This file is the
# single source of truth for Phase-3 parameters — fee_sim3 reads it via
# diversification.allocator.load_config().

sleeves:
  spy: ["SPY"]
  small_mid: ["MDY", "IWM"]
  dividend: []            # dynamic: membership decided by dividend_audit.audit_basket
  bonds: ["VCSH", "VCIT", "BIL", "SHY", "SGOV"]

# The CEO's fixed allocation (40 SPY / 20 small-mid / 20 dividend / 20 bonds)
# with the standing small-cap floor (10-15%, D-20260802-002) applied: the
# small/mid sleeve is floored at 0.15 and the freed 0.05 goes to SPY (the core
# large-cap sleeve), making the SPY cash-comparison conservative.
static_targets:
  spy: 0.45
  small_mid: 0.15
  dividend: 0.20
  bonds: 0.20

# Sleeve bounds for the gradient-descent optimizer (pre-registered).
sleeve_bounds:
  spy: [0.30, 0.70]
  small_mid: [0.10, 0.15]
  dividend: [0.10, 0.50]
  bonds: [0.10, 0.50]

# Gradient-descent optimizer (pre-registered; never tuned to results).
optimizer:
  learning_rate: 0.05
  max_iters: 2000
  tol: 1.0e-8
  seed: 42
  num_grad_eps: 1.0e-6
  risk_lambda: 2.0        # penalty on annualized variance: punishes risky weights
  max_drawdown_bound: 0.30  # HARD: portfolio down at most 30% at any point
  dd_penalty: 50.0        # penalty coefficient when the 30% bound is breached
  train_end: "2022-12-31"   # in-sample fit uses all data at/under this date
  oos_start: "2023-01-01"   # OOS validation begins here
  trailing_window_years: 3  # ADAPTIVE re-fit trailing window
  embargo_days: 21
  initial_guesses: ["static", "equal"]

# Profit-change opportunistic OR-gate (CEO: switch only on significant profit
# changes). Complements the Phase-2 z-gate as an OR; never replaces it.
profit_change:
  window_days: 90
  threshold: 0.15   # |trailing portfolio return| >= 15% over the window = significant
  state_gate: "bear"  # only considered in the bear macro state

# Cash-shortfall relocation ablation (reported, never a core lever).
cash_shortfall:
  min_cash_ratio: 0.01   # relocate when cash < 1% of portfolio value
  relocation: "macrostate"  # sell toward the macro-state-preferred sleeve

# --- Discovery B-20260804-001: return-max pivot (pre-registered BEFORE any run;
# invariant 4. Every value is fixed before the backtest; nothing is fit to
# outcomes. The CEO's Sharpe>=0.70 / maxDD<40% / fees<$200 are SUCCESS bars,
# not optimizer constraints.) ---
return_max:
  # Test-1 objective: maximize expected annualized return of the equity complex.
  # Vol/Sharpe are NOT penalized (diversifying for Sharpe is out of scope).
  # The only risk term is the hard drawdown bound at the CEO's new 40% bar.
  objective: "ann_return"       # ann_mean - dd_penalty*breach, breach=max(0,-maxdd-bound)
  max_drawdown_bound: 0.40
  dd_penalty: 20.0
  learning_rate: 0.05
  max_iters: 2000
  tol: 1.0e-8
  seed: 42
  num_grad_eps: 1.0e-6
  train_end: "2022-12-31"       # RM-ML-STATIC in-sample fit cutoff (held statically)
  oos_start: "2023-01-01"
  embargo_days: 21
  trailing_window_years: 3      # RM-ML adaptive re-fit window

  # Equity weight by macro state (HARD anchor - the CEO's rules, not the ML).
  # Bear = "buy-more" regime; bull rides strong momentum; neutral in between.
  state_equity:
    bull: 0.75
    neutral: 0.65
    bear: 0.85

  # Within-equity-complex bounds for the ML optimizer (fractions of the equity
  # total; feasible: 0.25+0.05+0.10 <= 1 <= 0.60+0.25+0.40). High vs low
  # diversification differ only in the bounds + the bonds residual.
  within_equity_bounds_high:
    spy: [0.25, 0.60]
    small_mid: [0.10, 0.25]
    dividend: [0.10, 0.40]
  within_equity_bounds_low:
    spy: [0.40, 0.80]
    small_mid: [0.00, 0.10]
    dividend: [0.00, 0.30]
  bonds_residual: "1-equity"        # HIGH: bonds = 1 - E always
  low_diversification_bonds_max: 0.15  # LOW: bonds capped, freed weight stays in equity

  # Static within-equity split for the rule-only (non-ML) variant.
  static_within:
    spy: 0.50
    small_mid: 0.15
    dividend: 0.35

  # Bear buy-more (CEO rule): in the bear state the equity complex is
  # concentrated 60/25/15 into the OOS-audited stable-dividend basket (quality
  # cashflow names) / SPY / small-mid. Names the dividend audit rejects (dividend
  # cut, weak yield) are EXCLUDED - that is the "moat significantly impacted"
  # hold-back gate.
  bear_buy_more:
    basket_share: 0.60
    spy_share: 0.25
    small_mid_share: 0.15
    moat_gate: "audit-reject"

  # Bullish momentum overweight: lightweight 2-state (up/down) Markov chain per
  # equity member over the trailing feature-stability window; overweight the
  # top-K by P(up next | current state) in the bull state. Trailing-only.
  momentum:
    enabled: true
    window_days: 252
    min_obs: 120
    tilt: 1.5
    max_tilted: 3
    tilt_threshold: 0.5   # only members with P(up|current) > 0.5 are "leaders"
    gate: "bull"

  # Downside engine (Test-2 / Final): crisis de-risk pulse on SPY's trailing
  # 21-day return. When <= arm, equity total is capped at max_equity_when_de_risked
  # (flight to the bonds sleeve) until the pulse recovers above disarm.
  downside_engine:
    enabled: true
    signal: "spy-trailing-21d-return"
    arm: -0.10
    disarm: -0.05
    max_equity_when_de_risked: 0.40

  # Fee discipline (Final bar): event-driven trading only - re-trade on macro
  # state transitions, crisis arm/disarm, or the quarterly boundary. Expected
  # ~1-4 trades/yr; target total fees < $200.
  fee_discipline:
    enabled: true
    trade_on: ["state-transition", "crisis-arm-disarm", "quarter-boundary"]
    max_trades_per_year: 4
    target_fee_budget: 200
