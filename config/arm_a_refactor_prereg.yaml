phase: 9
document: "arm_a_refactor_prereg"
version: "1.0"
date: "2026-10-04"
status: "DRAFT_AWAITING_CEO_APPROVAL"
adds_to: "config/pre_registration_v7.yaml"
does_not_supersede: "7.0"
source_plan: ".agents/project/org/decisions/_drafts/arm_a_refactor_plan.md (v2.0)"

# === VOL TARGETING (consumed by portfolio/allocator.py) ===
vol_targeting:
  enabled: true
  target_annual_vol: 0.11          # 11% (midpoint of the 10-12% range)
  lookback_days: 63                # Rolling 63-day realized vol window
  scale_factor_formula: "min(1.0, target_vol / realized_vol)"
  equity_cap: 1.0                  # Max 100% equity when vol < target
  cash_instruments: ["BIL", "SHY", "GLDM"] # Short-term T-bills + GLDM gold ETF for de-risking
  vol_floor: 0.05                  # 5% minimum portfolio vol
  vol_ceiling: 0.18                # 18% maximum portfolio vol

# === COMPOSITE SCORE REWEIGHT (consumed by gate_engine.py) ===
# Composite = SUM(directional_alpha * 0.65) + SUM(operational_health * 0.35)
# Rationale (arm_a_refactor_plan.md sec.1 rows 1-3): the prior composite put
# ~60% of its weight on operational metrics (ARI/TCA/probation/turnover), so
# "composite = stability, not alpha" (DSR 1.0 on Sharpe 0.15).  The reweight
# moves >=60% of mass onto return-predictive factors.
composite_weights:
  directional_alpha:
    total_weight: 0.65
    components:
      momentum_12m_1m: 0.20            # 12m minus 1m cross-sectional momentum
      eva_spread: 0.15                 # Economic Value Added spread (ROIC - WACC)
      ocf_yield_revision: 0.15         # OCF yield x sign(EPS revision 3m)
      dividend_carry_coverage: 0.15    # FCFE / Dividends paid (carry sustainability)
  operational_health:
    total_weight: 0.35
    components:
      realized_sharpe: 0.15            # Realized Sharpe ratio
      max_drawdown: 0.10               # Maximum drawdown (penalty)
      transaction_fee_drag: 0.10       # Transaction fee drag (penalty)

# === TURNOVER CONTROLS ===
turnover_controls:
  hysteresis_deadband: 0.15            # |w_actual - w_target| / w_target <= 0.15 -> NO TRADE
  swap_gap_z: 0.8                      # Opportunistic swap: candidate must beat incumbent by +0.8z
  min_holding_days: 60                 # Mandatory dwell per position
  max_monthly_turnover: 0.10           # 10%/mo hard cap
  calendar_rebalance: "quarterly"      # "quarterly" | "monthly_first"

# === MARKET EVENT DETECTION & GRADED DE-RISKING (3-stage) ===
market_event_detection:
  triggers:
    spread_velocity:
      threshold_bps_per_day: 0.5       # d(CreditSpread) > 0.5 bps/day
      persistence_days: 3              # Must hold 3 consecutive days
    bocpd_regime_shift:
      posterior_threshold: 0.85        # P(r=0) > 0.85
      persistence_days: 2              # 2-day sustained posterior mass
    spy_trend_break:
      threshold: "200d_sma"            # SPY < 200-day SMA
      buffer_pct: 0.015                # 1.5% buffer below the SMA
      persistence_days: 3              # 3 consecutive closes below barrier

  # STAGE 1: PERSISTENCE GATE — filters transient spikes vs sustained trends
  persistence_gate:
    enabled: true
    description: "Filter transient spikes vs sustained trends"

  # STAGE 2: GRADED DE-RISKING — no binary cliffs
  graded_derisking:
    enabled: true
    steps:
      - day: 3                         # Day 3 after confirmation
        equity_cap: 0.70               # Cap equity at 70%
      - day: 5                         # Day 5 after confirmation
        equity_cap: 0.50               # Cap equity at 50%
      - day: 10                        # Day 10 after confirmation
        equity_cap: 0.40               # Cap equity at 40%
    cash_allocation: ["BIL", "SHY"]    # Excess goes to short-term Treasuries

  # STAGE 3: RE-ENTRY EMBARGO — prevents buying back into a falling knife
  reentry_embargo:
    enabled: true
    min_cooldown_days: 21              # Minimum 21 trading days
    max_cooldown_days: 60              # Maximum 60 trading days
    description: "Mandatory hold of defensive buffer; prevents buying back into falling knife"
    exit_condition: "All triggers retracted AND cooldown elapsed"

# === TAIL HEDGE ===
tail_hedge:
  max_drawdown_cap: 0.15               # 15% max drawdown cap
  delever_trigger_vol_z: 2.0           # Portfolio vol > 2 sigma triggers de-lever
  delever_speed: 0.5                   # 50% position reduction per rebalance

# === COST MODEL ===
cost_model:
  round_trip_bps: 15                   # 15 bps per trade
  slippage_bps: 5                      # 5 bps slippage

# =============================================================================
# FACTOR DATA CONTRACTS
# =============================================================================
# Declared inputs per factor, the canonical columns gate_engine.py reads, and
# their availability in the repo as of 2026-10-04.  A factor whose inputs are
# all present is COMPUTABLE; otherwise it raises FactorDataUnavailable.  This
# table exists so the composite's coverage is auditable rather than assumed —
# a factor that silently returns 0.0 for 65% of its weight is worse than a
# loud failure, because 0.0 is a legitimate cross-sectional z-score.
#
# Price source:   data/master_prices/{TICKER}.parquet   cols [Open High Low Close Volume]
# Fundamentals:   data/pit_fundamentals/valuation_fundamentals.parquet
# Dividends:      data/master_dividends/{TICKER}.parquet  col [Dividends]
# =============================================================================
factor_data_contracts:
  prices:
    path: "data/master_prices/{ticker}.parquet"
    date_index: "Date"
    close_column: "Close"
    available: true
  fundamentals:
    path: "data/pit_fundamentals/valuation_fundamentals.parquet"
    keys: ["ticker", "fiscal_end_date", "filed_date"]
    pit_rule: "join on filed_date <= as_of_date (no forward fill)"
    available: true
  dividends:
    path: "data/master_dividends/{ticker}.parquet"
    date_index: "Date"
    column: "Dividends"
    available: true

  factors:
    momentum_12m_1m:
      weight: 0.20
      required_inputs: ["prices"]
      columns: ["Close"]
      available: true
      note: "Fully computable from data/master_prices."
    eva_spread:
      weight: 0.15
      required_inputs: ["fundamentals", "sector_map"]
      columns:
        roic: "roic"
        wacc: "wacc_estimate"     # v7-era column name; brief said "wacc"
      sector_map: "data/pit_fundamentals/valuation_fundamentals.parquet has no sector column"
      available: partial
      blocking_gap: >-
        Two independent gaps, neither closed by the OCF pipeline.
        (1) SECTOR MAP: no sector column exists in the PIT fundamentals table,
        so the sector-neutralisation half of the spec cannot be executed as
        written. Without it the factor ranks quality across sectors and
        structurally flatters Utilities/Industrials over Software. Supply a PIT
        sector map (CIK -> GICS, point-in-time) or the factor must be
        dropped/reweighted - do NOT run it un-neutralised and call it the
        pre-registered factor.
        (2) CONSTANT INPUTS: in the merged PIT universe the WACC and ROIC legs
        are mostly sector-median constants, not point-in-time filer values.
        Measured over 84,000 merged rows: roic_source is sector_median for
        54,497 rows (64.8%), wacc_source is fundamentals_filed for 50,731 rows
        (60.4%) but sector_median for 29,997 rows (35.7%), and 3,272 wacc rows
        (3.9%) are forward_filled - which the PIT rule above forbids. So even
        with a sector map, a large minority of the spread is a cross-sectional
        constant plus forward fill, not a filer-derived quantity. The
        factor_computer extraction defects (see ocf_yield_revision) are fixed,
        so newly-computed roic/wacc are PIT-clean, but they must actually be
        rebuilt before this factor can be called point-in-time.
    ocf_yield_revision:
      weight: 0.15
      required_inputs: ["fundamentals", "prices", "consensus_estimates"]
      columns:
        ocf: "operating_cash_flow"
        market_cap: MISSING
        eps_est_current: MISSING
        eps_est_3m_ago: MISSING
      available: false
      blocking_gap: >-
        Still NOT computable, and the OCF pipeline did not unblock it. Two
        separate reasons, either one sufficient:
        (1) CONSENSUS EPS - the revision leg (sign of EPS change 3m) has no
        source at all. valuation_fundamentals.parquet has no market cap (needs
        diluted shares, which the table also lacks) and no analyst EPS
        estimates. This remains 15% of the 65% directional block and requires
        a consensus-estimate vendor feed plus a PIT share-count source. The
        CEO ruling that OCF extraction alone does not unblock this factor
        stands: with no EPS feed there is no revision to weight the yield by.
        (2) OCF COVERAGE - the EDGAR extraction path is now real (see
        sec_edgar_ocf below) and derives market_cap from PIT shares x PIT
        price instead of leaving it hardcoded None, but the local company-facts
        table contains ZERO NetCashProvidedByUsedInOperatingActivities rows
        across 526,202 rows / 84 concepts, and OCF-bearing columns cover only
        46.9% of merged rows (969 of 1,708 tickers; 199-556 per rebalance
        date) - below the 55% floor the panel coverage gate enforces.
    sec_edgar_ocf:
      weight: 0.00                # enabling dependency, not a scored factor
      available: partial
      status: >-
        PIT-clean extraction path shipped and compiling; OCF/FCF/CAPEX are now
        first-class panel columns (OCF_TTM, CAPEX_TTM, FCF, OCF_Yield,
        FCF_Yield) with a loud coverage gate, but the data to feed them is not
        yet present. See the blocking_gaps below - this entry exists so the
        OCF pipeline's true state is tracked in config, not assumed fixed.
      fixed_defects:
        - "concept matching was exact-match on 'us-gaap:'-prefixed names while the facts table stores concepts bare, so every fundamental extraction returned None"
        - "facts table columns are [as_of, filed, ticker, cik, accession, form, fiscal_end, field, value, concept]; extractors indexed 'val'/'end', raising KeyError that the per-ticker except swallowed"
        - "market_cap was hardcoded None, making FCF_Yield structurally unreachable and silently demoting WACC to book equity as the equity weight"
      blocking_gaps:
        - "NetCashProvidedByUsedInOperatingActivities absent from data/sec_facts/facts/facts.parquet (0 rows); OCF_TTM/FCF/OCF_Yield therefore emit null today"
        - "data/sec_facts/facts/provenance.json declares row_count 19800 and source synthetic://sec_companyfacts, but the file holds 526,202 rows - provenance is stale and the table is synthetic, so it is not an EDGAR pull"
        - "StockholdersEquity absent too; only a derived 'computed:long_term+short_term' value exists, so the ROIC capital base is not filer-derived"
        - "data/universe/merged_pit_universe.parquet is a hive-partitioned DIRECTORY that fails to read with default pyarrow settings (rebalance_date date32 vs dictionary<string>) and requires partitioning=None"
    dividend_carry_coverage:
      weight: 0.15
      required_inputs: ["fundamentals", "dividends"]
      columns:
        fcfe: "fcf"                 # FCFE proxy: the table's `fcf` column
        dividends_paid: MISSING     # per-share dividend from master_dividends
      available: partial
      blocking_gap: >-
        The unit-mixing problem has a known fix but the numerator is still
        missing. Converting the per-share dividend leg (master_dividends) to
        dollars needs a PIT share count, and factor_computer now derives one
        (PIT shares x PIT price for market cap, same shares for per-share
        conversion), so the denominator side is no longer structurally
        blocked. But the numerator `fcf` depends on the EDGAR OCF gap above:
        with zero OCF rows in the facts table, FCF cannot be computed, so the
        ratio still cannot be formed. Per-share dividend COVERAGE across the
        1,708-ticker merged universe is also unmeasured. This stays partial
        until OCF data lands and dividend coverage is quantified.
    realized_sharpe:
      weight: 0.15
      required_inputs: ["returns"]
      available: true
    max_drawdown:
      weight: 0.10
      required_inputs: ["wealth_curve"]
      available: true
    transaction_fee_drag:
      weight: 0.10
      required_inputs: ["turnover"]
      available: true

  coverage_note: >-
    3 of 7 factors are fully computable (realized_sharpe, max_drawdown,
    transaction_fee_drag -> the whole 0.35 operational block, plus
    momentum_12m_1m at 0.20). ocf_yield_revision (0.15) is NOT computable,
    eva_spread (0.15) and dividend_carry_coverage (0.15) are PARTIAL.
    Maximum currently-valid composite weight = 0.20 + 0.35 = 0.55 of 1.00.
    Renormalising the missing 0.45 across survivors is a POST-HOC weight change
    and needs its own CEO ruling; gate_engine.py will not do it silently.
    Workstream B note (2026-10-06): the GLDM gold ETF joined cash_instruments
    and the EDGAR OCF extraction path was repaired and made PIT-clean, but
    NEITHER raises the computable weight. ocf_yield_revision stays blocked on
    the absent consensus-EPS feed regardless of OCF, eva_spread stays blocked
    on the missing PIT sector map plus its sector-median/forward-filled legs,
    and dividend_carry_coverage stays blocked on the OCF data gap. The 0.55
    ceiling is unchanged and remains the maximum defensible composite weight.
