# Sub-area alias normalization: map a raw sector/industry string (e.g. from the
# valuation roster or ai_cons taxonomy) onto a canonical sub_area label so the
# "same sub-topics / different sub-topic" comparison is not fooled by label
# casing/abbreviation drift.
sub_area_aliases:
  semiconductor: "chip_design"
  semiconductor_equipment: "chip_equipment"
  hardware_oem: "hardware_oem"
  networking: "networking"
  cloud_internet: "cloud_internet"
  platform_software: "application_software"
  energy: "energy"
  utilities: "utilities"
  software: "application_software"
  computers: "hardware_oem"
  semiconductors: "chip_design"

# Wikidata industry label aliases: normalize Wikidata industry strings (fetched
# via P452) onto exact Damodaran industry keys in this file.
industry_aliases:
  "semiconductor industry": "Semiconductor"
  "semiconductor equipment": "Semiconductor Equipment"
  "electrical industry": "Semiconductor"
  "information technology": "Computer Services"
  "retail": "Retail (Internet)"
  "software industry": "Software (System & Application)"
  "technology": "Software (System & Application)"

# Thread-B grouping defaults (overridable from config/sentinel.yaml).
thread_b:
  beta_band: 0.15        # same-business-area grouping tolerance (unlevered beta +/- band)
  prefer_different_sub_area: true  # target same band but a DIFFERENT sub-topic within it

# Staged-update provenance. `last_updated` is informational; the automation
# writes to `candidate_path` which the CEO approves before merge.
update:
  source: "Damodaran unlevered beta by industry (public, periodically refreshed)"
  last_updated: "2026-08-28"
  refresh_cadence: "monthly"
  candidate_path: "config/industry_beta_candidate.yaml"
  auto_replace: false   # NEVER auto-replace; staged CEO-approved merge only

# --- Staging block (CLI helper writes a draft here for CEO review, never live) ---
staging:
  candidate: {}
