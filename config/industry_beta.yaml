# Pre-registered industry -> unlevered beta table for the Wikidata Thread-B
# category discovery lane (ruling D-20260828-001).
#
# Business-core fingerprint: DAMODARAN unlevered beta by industry. Promoted out
# of dashboard/stream_quant.py (was a hardcoded dict) into a pre-registered,
# fail-closed config per house invariant 4 (config, not hard-coded constants).
#
# UPDATE POLICY (staged, never silent): refreshing this table is a STAGED
# monthly process -- an automated fetch writes a CANDIDATE file, which the CEO
# reviews and approves BEFORE it replaces the live `industries` block. The
# `update` section tracks provenance; nothing auto-replaces at load time.
#
# The loader discovery/industry_beta.py validates this file fail-closed:
# unknown keys, missing required keys, NaN, or non-positive beta => load error.
# Every industry entry must carry a positive `unlevered_beta` and a sub-area
# label used for the "same sub-topics / different sub-topic" differentiation.

industries:
  "Software (System & Application)": {unlevered_beta: 1.27, sub_area: "application_software"}
  "Computer Services":              {unlevered_beta: 0.85, sub_area: "it_services"}
