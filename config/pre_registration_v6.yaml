# ============================================================
# UNIFIED REGIME ARCHITECTURE
# ============================================================
# Three-layer regime detection system:
# 1. BOCPD (Seismic Shock Alarm): Instant structural break detection (r_t = 0)
# 2. IO-HMM (Wind-Vane): Tier 1 macro states using continuous market velocity
#    - EXPANSION, CHOPPY/STRESS, CRISIS (3 states)
# 3. Micro-States (Economic Engines): Tier 2 specific threat identification
#    - GOLDILOCKS, LATE_CYCLE_DRAG, LIQUIDITY_CRUNCH, STAGFLATION

# Decision Logic:
# - BOCPD Alarm (r_t = 0) → FORCE CRISIS (circuit breaker)
# - IO-HMM (Wind-Vane): Tier 1 macro states using continuous market velocity
# - Micro-States: Tier 2 specific threat identification within macro context
# - BOCPD Override: If P(r_t=0) > 0.95 → FORCE CRISIS (circuit breaker)

# ============================================================
# UNIFIED REGIME ARCHITECTURE
# ============================================================
unified_regime:
  # BOCPD (Seismic Shock Alarm) — Instant structural break detection
  bocpd:
    hazard_rate: 0.01
    threshold: 0.95              # P(r_t = 0) threshold for alarm
    min_run_length: 5            # Minimum run length before alarm
    max_run_length: 500          # Maximum run length to track
    observation: "credit_spread_velocity_21d"  # BAA10Y 21-day velocity
    alarm_action: "FORCE_CRISIS" # Circuit breaker: forces CRISIS regime
    override_weight: 0.8         # Weight for BOCPD alarm override
    
    # Gaussian-Gamma prior (conjugate prior for unknown mean/variance)
    prior_mu_0: 0.0
    prior_kappa_0: 1.0
    prior_alpha_0: 2.0
    prior_beta_0: 1.0
  
  # IO-HMM (Wind-Vane) — Tier 1 Macro States
  io_hmm:
    n_states: 3
    state_names: ["EXPANSION", "CHOPPY", "CRISIS"]
    state_names_short: ["EXP", "CHOPPY", "CRISIS"]
    
    # Input features (exogenous market velocity)
    input_features:
      - "credit_spread_velocity"   # ΔSpread_21d (bps/day)
      - "yield_curve_momentum"     # Δ(10Y-2Y)_21d (bps/day)
      - "realized_vol_21d"         # 21-day realized vol (annualized)
      - "credit_spread_level"      # Level of credit spread (bps)
      - "yield_curve_slope"        # 10Y-2Y slope (bps)
      - "vix_level"                # VIX level
    
    # Transition dynamics: p(s_t | s_{t-1}, u_t)
    # log p(s_t=j | s_{t-1}=i, u_t) = θ_{i→j} + β_{i→j} @ u_t
    transition_prior_alpha: 1.0
    input_weight_prior_sd: 1.0
    sticky_prior: 10.0
    
    # Emission model
    emission_prior_kappa: 1.0
    emission_prior_alpha: 2.0
    emission_prior_beta: 1.0
    
    # Initial state prior
    initial_prior: [0.6, 0.3, 0.1]
    
    # Regularization
    l2_penalty: 1e-3
    sticky_prior: 10.0
    
    # Decision thresholds
    crisis_threshold: 0.7
    choppy_threshold: 0.4
  
  # Micro-States (Economic Engines) — Tier 2 Specific Threats
  micro_states:
    enabled: true
    states:
      - name: "GOLDILOCKS"
        description: "Low inflation, healthy credit"
        conditions:
          cpi_yoy_max: 2.5
          real_rate_max: 1.5
          hy_oas_max: 150
          vix_max: 20
          curve_min: 50
        pipeline_action: "LOWER_HURDLE_RATES"
        wacc_adjustment_bps: -50
      
      - name: "LATE_CYCLE_DRAG"
        description: "Inverted curve, tightening solvency"
        conditions:
          curve_max: 0
          hy_oas_min: 200
        pipeline_action: "TIGHTEN_ENTRY_TRIM_CYCLICALS"
        wacc_adjustment_bps: 25
      
      - name: "LIQUIDITY_CRUNCH"
        description: "High real rates, credit freeze"
        conditions:
          real_rate_min: 2.0
          hy_oas_min: 400
          stl_fsi_min: 1.5
        pipeline_action: "DOWN_FILTER_SHIFT_TO_BIL"
        lambda_stress_mult: 2.0
      
      - name: "STAGFLATION"
        description: "Hot inflation, supply disruption"
        conditions:
          cpi_yoy_min: 3.5
          real_rate_min: 1.0
        pipeline_action: "ROUTE_CASH_TO_GOLD"
    
    # Micro-state decision thresholds
    goldilocks_inflation_max: 2.5
    goldilocks_real_rate_max: 1.5
    goldilocks_spread_max: 150
    goldilocks_vix_max: 20
    goldilocks_curve_min: 50
    
    late_cycle_curve_max: 0
    late_cycle_spread_min: 200
    
    crunch_real_rate_min: 2.0
    crunch_spread_min: 400
    crunch_stl_fsi_min: 1.5
    
    stagflation_cpi_min: 3.5
    stagflation_real_rate_min: 1.0
  
  # Integration weights
  integration:
    bocpd_override_weight: 0.8
    io_hmm_weight: 1.0
    micro_weight: 1.0
    crisis_threshold: 0.7
    choppy_threshold: 0.4
    min_dwell_days: 10
    max_transitions_per_year: 6

# ============================================================
# HMM SPECIFICATION (Legacy - kept for compatibility)
# ============================================================
hmm:
  n_states: 3
  state_names: ["EXPANSION", "CHOPPY", "CRISIS"]
  layer1_features:
    - "BAA10Y"
    - "10Y2Y"
    - "CP_TBill"
    - "RealizedVol21d"
    - "HY_OAS"
    - "CESI"
  train_window_years: 3
  retrain_frequency: "quarterly"
  emission_covariance: "diagonal"
  covariance_floor: 1e-4
  state_ordering: "credit_spread_mean"
  transition_prior: "dirichlet"
  dirichlet_lambda: 0.10
  sticky_kappa: 500
  class_weights:
    EXPANSION: 1.0
    SHOCK: 1.0
    CRISIS: 2.0
  validation:
    method: "expanding_window_oos_market_labels"
    label_definition: "NBER recession (6m lag) + Sahm Rule (1m lag) -> 3-state: EXP/SHOCK/CRISIS"
    folds_required: 3
    ari_threshold: 0.45
    action_on_fail: "abort_pipeline"
    # Diagnostic metrics (not gates):
    precision_crisis_target: 0.50
    recall_crisis_target: 0.40
    f1_crisis_target: 0.44
    false_alarm_rate_max: 0.15
    mean_dwell_days_min: 63
    transitions_per_year_max: 6

# ============================================================
# PARAMETER CLUSTERS (Joint Optimization, 500 LHS)
# ============================================================
parameter_clusters:
  A_wacc_regime:
    description: "WACC & Regime Engine (high correlation ρ>0.7)"
    params:
      - name: "ke_var_threshold"
        type: "float"
        values: [0.0075, 0.0085, 0.0100]
        description: "ke dispersion threshold (data-derived floor 77bps)"
      - name: "hmm_n_states"
        type: "int"
        values: [3]
        description: "FROZEN - not optimized"
      - name: "omega_stress_multiplier"
        type: "float"
        values: [1.5, 2.0, 2.5]
        description: "Ω_stress multiplier for CRISIS regime"
    correlation: "high"
    correction: "none"

  B_swap_exit:
    description: "Swap Barrier & Exit Scheduler (high correlation ρ>0.6)"
    params:
      - name: "swap_barrier_gamma"
        type: "float"
        values: [0.15, 0.18, 0.20]
        description: "Exponential decay rate (reduced sensitivity)"
      - name: "swap_barrier_C"
        type: "float"
        values: [0.028, 0.032, 0.035]
        description: "Initial barrier height (raised from 0.015)"
      - name: "trailing_pct"
        type: "float"
        values: [0.14, 0.16, 0.18]
        description: "Trailing-stop distance from high-watermark (raised from 0.10)"
      - name: "min_hold_days"
        type: "int"
        values: [30, 35, 40]
        description: "Minimum holding period before stop can trigger"
      - name: "cooldown_days"
        type: "int"
        values: [45, 60, 90]
        description: "Cooldown after stop-out before re-entry"
      - name: "hmm_min_dwell_days"
        type: "int"
        values: [15, 20]
        description: "Minimum consecutive days in regime before transition"
      - name: "wacc_regime_adjustment"
        type: "bool"
        values: [true]
        description: "FROZEN at true (regime adjusts discount rate)"
    correlation: "high"
    correction: "none"

  C_entry_thresholds:
    description: "Regime-Conditional Entry Thresholds (moderate correlation ρ~0.4)"
    params:
      - name: "entry_exp"
        type: "float"
        values: [0.85, 0.90, 0.95]
        description: "EXPANSION: ×IV_P25"
      - name: "entry_shock"
        type: "float"
        values: [0.85, 0.90, 0.95]
        description: "CHOPPY: ×IV_P25"
      - name: "entry_crisis"
        type: "float"
        values: [0.70, 0.75, 0.80]
        description: "CRISIS: ×IV_P25 (Black Swan opportunism)"
    correlation: "moderate"
    correction: "none"

  D_probation_qual:
    description: "Probation & Qual Gates (low correlation ρ<0.3)"
    params:
      - name: "probation_band_low"
        type: "float"
        values: [0.35, 0.38]
        description: "Test widened band vs narrowed"
      - name: "probation_band_high"
        type: "float"
        values: [0.62, 0.65]
        description: "Test widened band vs narrowed"
      - name: "qual_weight"
        type: "float"
        values: [0.0]
        description: "FROZEN at 0.0 — Arm B/C retired per CEO ruling 2026-09-27"
      - name: "mapping_conf_threshold"
        type: "string"
        values: ["high"]
        description: "Only high-confidence qual mappings (unused, Arm B retired)"
    correlation: "low"
    correction: "none"

# ============================================================
# OPTIMIZATION PROTOCOL
# ============================================================
optimization:
  method: "lhs_sobol"
  n_samples: 500
  clusters: ["A_wacc_regime", "B_swap_exit", "C_entry_thresholds", "D_probation_qual"]
  cv:
    type: "purged_embargoed"
    purge_formula: "trailing_tau * 5"
    embargo_months: 12
    walkforward_folds: 4
    inner_cv: "timeseries_split"
    inner_splits: 3
  metric: "composite_dsr"
  dsr_tracking:
    base_n: 13
    lhs_n: 500
    total_n: 513
    track_record_days: 2520
  tca_in_loop: true
  synthetic_fallback: "disabled"
  trial_tracker:
    class: "TrialTracker"
    log_every_param_set: true
    sha256_ledger: true

# ============================================================
# WALK-FORWARD WINDOWS (Fixed, No Window Shopping)
# ============================================================
windows:
  primary:
    start: "2018-01-01"
    end: "2024-12-31"
    description: "7-year RPO-clean core window"
    folds:
      fold_1:
        train_start: "2018-01-01"
        train_end: "2020-12-31"
        test_start: "2021-01-01"
        test_end: "2021-12-31"
