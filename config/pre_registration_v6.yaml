# Phase 9 Sprint 6 Pre-Registration Configuration — FROZEN BEFORE EXECUTION
# UNIFIED REGIME ARCHITECTURE: BOCPD + IO-HMM + MICRO-STATES

phase: 9
version: "6.0"
date: "2026-09-27"
status: "APPROVED"

# ============================================================
# UNIFIED REGIME ARCHITECTURE
# ============================================================
# Three-layer regime detection system:
# 1. BOCPD (Seismic Shock Alarm): Instant structural break detection (r_t = 0)
# 2. IO-HMM (Wind-Vane): Tier 1 macro states using continuous market velocity
#    - EXPANSION, CHOPPY/STRESS, CRISIS (3 states)
# 3. Micro-States (Economic Engines): Tier 2 specific threat identification
#    - GOLDILOCKS, LATE_CYCLE_DRAG, LIQUIDITY_CRUNCH, STAGFLATION

# Decision Logic:
# - BOCPD Alarm (r_t = 0) → FORCE CRISIS (circuit breaker)
# - IO-HMM (Wind-Vane): Tier 1 macro states using continuous market velocity
# - Micro-States: Tier 2 specific threat identification within macro context
# - BOCPD Override: If P(r_t=0) > 0.95 → FORCE CRISIS (circuit breaker)

# ============================================================
# SIMPLIFIED STATISTICAL DESIGN
# ============================================================
# Single unified metric: COMPOSITE_SCORE = f(Sharpe, DD, Turnover, ARI, Swap, TCA, Probation, WACC)
# Evaluation: DSR (Deflated Sharpe Ratio) on COMPOSITE_SCORE across concatenated 4-fold OOS returns
# Multiplicity: Honest trial accounting N=513 (13 base + 500 LHS) via DSR — NO per-gate corrections
# Track record: Full walk-forward period (84 months = 2520 trading days), NOT per-fold
# Falsification: Parameter set FAILS if DSR(composite) < 0.95 on Fold 4 (2024 TRUE OOS)

statistical_design:
  metric: "composite_dsr"
  composite_components:
    - name: "sharpe"
      weight: 0.25
      target: "> 1.0"
    - name: "max_drawdown"
      weight: 0.20
      target: ">= -0.20"
    - name: "turnover"
      weight: 0.15
      target: "<= 0.30"
    - name: "hmm_ari"
      weight: 0.15
      target: ">= 0.70 (on concatenated 4-fold)"
    - name: "swap_churn"
      weight: 0.10
      target: "< 5.0 swaps/yr"
    - name: "tca_bps"
      weight: 0.10
      target: "<= 150"
    - name: "probation_pass_rate"
      weight: 0.05
      target: "in [0.35, 0.65]"
  dsr:
    method: "deflated_sharpe_ratio"
    n_trials: 513
    base_n: 13
    lhs_n: 500
    track_record_days: 2520  # Full 4-fold concatenated (84 months), NOT per-fold
    threshold: 0.95
  fold_evaluation:
    mode: "concatenated"  # All 4 folds combined for DSR
    fold_4_true_oos: true  # Fold 4 (2024) must independently satisfy DSR >= 0.95
  no_gate_hierarchy: true  # REMOVED: 8-gate Holm-Bonferroni structure

