    purpose: "qual_coverage_validation_only"
    regimes_covered: ["2022_INFLATION", "2023-24_NORMALIZATION", "2025-26_EMERGING"]

  strata:
    S4: {start: "2018-01-01", end: "2019-12-31", label: "PRE_COVID"}
    S5: {start: "2020-01-01", end: "2020-12-31", label: "COVID"}
    S6: {start: "2021-01-01", end: "2021-12-31", label: "RECOVERY"}
    S7: {start: "2022-01-01", end: "2023-12-31", label: "AI_BOOM"}
    S8: {start: "2024-01-01", end: "2026-12-31", label: "CURRENT"}

# ============================================================
# COST MODEL
# ============================================================
costs:
  commission_bps_per_side: 10
  slippage_base_bps: 50
  slippage_regime_multiplier:
    EXPANSION: 1.0
    SHOCK: 1.5
    CRISIS: 2.0
  market_impact_model: "almgren_chriss_lob"
  max_annual_tca_bps: 150
  concurrent_exit_stress_test: true

# ============================================================
# SUCCESS CRITERIA — SINGLE UNIFIED METRIC
# ============================================================
success_criteria:
  description: "Parameter set PASSES if DSR(composite) >= 0.95 on Fold 4 (2024 TRUE OOS)"
  fold_4_test:
    composite_dsr: ">= 0.95"
    # Component visibility (not gates, for diagnostics):
    oos_sharpe_arm_a: "> 1.0"
    max_drawdown_arm_a: "< -0.20"
    ir_vs_spy_arm_a: "> 0.30"
    # HMM ARI target with market-based labels (2-state, STLFSI2/VIX/HY_OAS)
    hmm_ari_concatenated: ">= 0.45"
    swap_churn: "< 5.0 swaps/yr"
    tca_bps: "<= 150"
    probation_pass_rate: "in [0.35, 0.65]"
    wacc_coverage: "== 1.0"
    provenance_chain: "valid"

# ============================================================
# EXECUTION CONSTRAINTS
# ============================================================
execution:
  rebalance_frequency: "monthly"
  fill_date: "first_trading_day_of_month_T_plus_1"
  signal_date: "month_end_T"
  max_turnover_per_rebalance: 0.30
  universe_size_target: 1500
  price_stale_max_days: 2
  illiquid_threshold_dollar_vol: 100000
  provenance_required: true
  sha256_all_artifacts: true

# ============================================================
# CEO APPROVAL BLOCK
# ============================================================
ceo_approval:
  required: true
  ruling: "APPROVE (Decision 3 — Unified DSR, Decision 1 — Statistical Fixes First, HMM Architecture Rewrite)"
  date: "2026-09-27"
  notes: "Simplified to single composite DSR metric with honest N=513. Removed 8-gate hierarchy, per-fold gates, and 1008-day contradiction. Track record = full concatenated 4-fold (2520 days). Fold 4 (2024) must independently satisfy DSR >= 0.95. Arm B/C retired per 2026-09-27 ruling. Parameter grids updated per alpha-worker recommendations. HMM REWRITE: Replaced broken FactorHMMv3 (percentile heuristic) with ClassWeightedGaussianHMM (Baum-Welch EM). 2-state (NORMAL/CRISIS) with event-driven retraining (quarterly). Market-based validation labels (STLFSI2>1.5 no-ffill, VIX>30, HY_OAS>500bps). Monthly Bayesian log-odds fusion. ARI target 0.45 (NOT YET ACHIEVED - best 0.2045). Class-weighted EM (CRISIS weight=1.5). ALL CODE FIXES APPLIED: 6→12 padding removed, synthetic data removed, FRED cache populated, EM stability improved. Gap to 0.45 target attributed to temporal HMM dynamics vs static GMM benchmark (0.48)."